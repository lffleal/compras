<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compras</title>
<meta name="theme-color" content="#2E6B3C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de telemóvel — cabeçalho fixo (listas + adicionar), secções do supermercado por cor, folhas de baixo para editar */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --ink:#18221A; --muted:#5F6E62; --line:#DCE3DA;
  --accent:#2E6B3C; --accent-ink:#FFFFFF; --accent-soft:#DCEBDD; --danger:#B3362B;
  --deal:#B5430F; --deal-soft:#FBE6D9;
  --c-fruta:#4E9A3A; --c-talho:#C2453A; --c-peixe:#2F7FB5; --c-lact:#6C8FD6; --c-pad:#C98A2B;
  --c-merc:#9A6A3C; --c-cong:#3AA6B9; --c-bebidas:#8A5BC7; --c-limpeza:#2D9A87; --c-higiene:#C95A92; --c-outros:#7D877F;
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111612; --surface:#1A211B; --ink:#E7EEE6; --muted:#97A699; --line:#2B352D;
  --accent:#6FBF7E; --accent-ink:#0E1A10; --accent-soft:#223527; --danger:#EC7468;
  --deal:#F2955E; --deal-soft:#3A2518;
  --c-fruta:#7CC566; --c-talho:#E7776C; --c-peixe:#62AEE0; --c-lact:#93AFEF; --c-pad:#E3AA52;
  --c-merc:#C9946A; --c-cong:#5CC8D9; --c-bebidas:#B38BEA; --c-limpeza:#52C3AE; --c-higiene:#E68ABA; --c-outros:#A3ADA5;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em;margin:0;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.top-r{display:flex;align-items:center;gap:4px}
.count{color:var(--muted);font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{padding:8px;border-radius:10px;display:flex;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;color:var(--muted)}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.icon{padding:7px 10px;display:flex;align-items:center}
.addbar{position:relative;margin-top:10px}
.addbar form{display:flex;gap:8px}
#add-input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
#add-input:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:var(--r);font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{padding:8px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgb(0 0 0 / .14);overflow:hidden;z-index:6;max-height:60vh;overflow-y:auto}
.sugg .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px;font-weight:700}
.sugg button.s{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px}
.sugg button.s[aria-selected="true"],.sugg button.s:hover{background:var(--accent-soft)}
.sugg .cat{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
.sugg .star{font-size:.72rem;font-weight:700;color:var(--accent);margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 12px}
.chips button{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--cc,var(--c-outros))}

main{padding-block:12px 120px}
.deal{display:flex;gap:12px;align-items:flex-start;background:var(--deal-soft);border:1px solid var(--deal);border-radius:var(--r);padding:12px 14px;margin-top:6px}
.deal b{color:var(--deal)}
.deal p{margin:2px 0 0;font-size:.9rem;color:var(--ink)}
.aisle{margin-top:14px}
.aisle h2{display:flex;align-items:center;gap:8px;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px 2px}
.aisle h2 .n{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:0}
.items{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.item{display:flex;align-items:center;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
.tick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 16px;text-align:left}
.box{width:24px;height:24px;border-radius:50%;border:2px solid var(--cc);flex:none;display:grid;place-items:center}
.box svg{opacity:0}
.txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{overflow-wrap:anywhere;font-weight:500}
.price{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.price .hot{color:var(--deal);font-weight:700}
.qty{flex:none;margin-left:auto;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);font-variant-numeric:tabular-nums}
.more{flex:none;padding:13px 14px;color:var(--muted);display:flex}
.done .box{background:var(--cc)}
.done .box svg{opacity:1}
.done .name{text-decoration:line-through;color:var(--muted)}
.done .qty,.done .price{opacity:.6}
.cart{margin-top:26px}
.cart h2 button{margin-left:8px;font-size:.8rem;font-weight:700;letter-spacing:0;text-transform:none;color:var(--danger);padding:2px 4px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:1.35rem;margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:34ch}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-top:10px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:420px;margin:0 auto;padding-block:32px}
.login .logo{width:64px;height:64px;border-radius:16px}
.login h1{font-size:2.4rem}
.login p{margin:0;color:var(--muted)}
.login form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em}
.link{color:var(--accent);font-weight:600;text-decoration:underline;padding:4px 0;align-self:flex-start}

/* sheets */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow-y:auto}
.sheet>*{flex-shrink:0}
.sheet h3{font-family:var(--f-display);font-size:1.3rem;margin:0}
.sheet h4{margin:4px 0 0;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .l{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input{font:inherit;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.catgrid button{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);font-size:.88rem;text-align:left}
.catgrid button[aria-pressed="true"]{border-color:var(--cc);background:var(--accent-soft);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.store{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}
.store .sn{font-weight:700}
.store .sp{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.store .sd{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.store input{grid-column:1/-1;font:inherit;font-size:.9rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.menu button.mi{display:flex;align-items:center;gap:12px;padding:14px 4px;text-align:left;border-bottom:1px solid var(--line);width:100%;font-weight:600}
.menu button.mi:last-child{border-bottom:0}
.menu .sub{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.hab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.hab .name{flex:1}
.hab[aria-pressed="true"]{background:var(--accent-soft)}
.hab[aria-pressed="true"] .name::after{content:" ✓";color:var(--accent);font-weight:800}
[data-lp]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hab .uses{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cat-jump{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:sticky;top:-18px;background:var(--surface);padding-block:8px;margin-top:-8px;z-index:1}
.cat-jump::-webkit-scrollbar{display:none}
.cat-jump button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;font-weight:600}
.catsec{display:flex;flex-direction:column;gap:8px;scroll-margin-top:56px}
.catsec h4{display:flex;align-items:center;gap:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:.92rem;text-align:left}
.pick button.hab{font-weight:600}
.pick button[aria-pressed="true"]{border-color:var(--cc);background:var(--accent-soft);font-weight:700}
.pick button[aria-pressed="true"]::before{content:"✓";color:var(--cc);font-weight:800}
#cat-filter{font:inherit;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<section id="login-view" class="wrap" hidden>
  <div class="login">
    <img class="logo" src="icon-192.png" alt="">
    <div><h1>Compras</h1><p>A lista do supermercado lá de casa.</p></div>
    <form id="login-form">
      <div class="field"><label for="li-email">E-mail</label><input id="li-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="li-pass">Palavra-passe</label><input id="li-pass" type="password" autocomplete="current-password" required></div>
      <div class="err" id="li-err"></div>
      <button class="btn" id="li-btn">Entrar</button>
      <button type="button" class="link" id="li-reset">Esqueci-me da palavra-passe</button>
    </form>
  </div>
</section>

<div id="app-view" hidden>
  <header>
    <div class="wrap">
      <div class="top">
        <h1 id="title">Compras</h1>
        <div class="top-r"><span class="count" id="count"></span>
          <button class="iconbtn" data-act="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Listas"></nav>
      <div class="addbar">
        <form id="add-form" autocomplete="off">
          <input id="add-input" placeholder="Adicionar… ex.: 2 iogurte líquido morango Mimosa" enterkeyhint="done" aria-label="Adicionar produto">
          <button type="button" class="btn ghost" id="cat-btn" data-act="catalog" aria-label="Ver produtos por secção"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor"/></svg></button>
          <button class="btn" id="add-btn" aria-label="Adicionar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </form>
        <div class="sugg" id="sugg" hidden></div>
      </div>
      <div class="note" id="note" hidden></div>
    </div>
  </header>
  <main class="wrap" id="main"><div class="empty"><p>A carregar…</p></div></main>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
